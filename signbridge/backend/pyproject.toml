[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signbridge-backend"
version = "0.1.0"
description = "SignBridge – Real-Time ISL Communication Platform Backend"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-4.0" }

dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",

    # ML / Vision
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.10.0",
    "numpy>=1.26.4",
    "Pillow>=10.3.0",

    # Data
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",

    # Config / Utils
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",

    # Rate limiting / security
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests/backend"]

